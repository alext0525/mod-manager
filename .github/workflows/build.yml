name: Build Windows exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ModManager-windows
          path: dist/*.exe
      # Releases go to the public mod-manager-releases repo: this source repo
      # is private, and installed copies check for updates without logging in.
      # latest.yml and the .blockmap are what they read to find and download
      # an update, so they go on the release with the exes. RELEASES_TOKEN is
      # a fine-grained token with Contents read/write on that repo only.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: alext0525/mod-manager-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
