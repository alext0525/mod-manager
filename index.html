<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mod Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mod Manager</h1>
    <div class="game-picker">
      <select id="gameSelect"></select>
      <button id="addGameBtn" title="Add another game">+ Add Game</button>
    </div>
  </header>

  <div id="appUpdateBar" class="banner info hidden"></div>

  <main>
    <div id="crashBanner" class="banner warn hidden"></div>
    <div id="gameUpdateBanner" class="banner warn hidden"></div>

    <section id="modePanel" class="mode-panel hidden"></section>

    <div id="dropZone" class="drop-zone">
      <p><strong>Drag mod files here</strong></p>
      <p class="hint">Accepts .zip, .rar and .7z — several at once is fine</p>
      <p class="hint" id="gameHint"></p>
      <p>or</p>
      <button id="browseBtn">Browse for mod files</button>
    </div>

    <div class="list-header">
      <h2>Installed Mods</h2>
      <div class="list-actions">
        <button class="secondary hidden" id="crashBtn" title="Read the game's crash report and logs to find the mod behind a crash">Crashed?</button>
        <button class="secondary" id="vanillaBtn" title="Take every mod out of the game (they stay saved in the app)">Back to vanilla</button>
        <button class="secondary" id="profilesBtn" title="Save and switch between sets of mods">Profiles</button>
      </div>
    </div>
    <ul id="modList" class="mod-list"></ul>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modalBox"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
